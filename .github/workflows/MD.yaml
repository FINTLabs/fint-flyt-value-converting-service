name: MD

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: Select environment
        required: true
        type: choice
        options:
          - aks-beta-fint-2021-11-23
          - aks-api-fint-2022-02-08
      org:
        description: Select organisation
        required: true
        type: choice
        options:
          - afk-no
          - agderfk-no
          - bfk-no
          - bym-oslo-kommune-no
          - ffk-no
          - fintlabs-no
          - innlandetfylke-no
          - mrfylke-no
          - nfk-no
          - ofk-no
          - rogfk-no
          - telemarkfylke-no
          - tromsfylke-no
          - trondelagfylke-no
          - vestfoldfylke-no
          - vlfk-no
jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: FINTLabs/fint-flyt-github-workflows/.github/workflows/java-app-build-image.yaml@dependabot/github_actions/github-actions-e224e3f0fb
    with:
      push-image: true
    secrets: inherit

  deploy:
    needs: build
    uses: FINTLabs/fint-flyt-github-workflows/.github/workflows/java-app-deploy-aks.yaml@edddaa4a7cc1393b11f7af11b06a66830d8c343b
    with:
      org: ${{ inputs.org }}
      cluster: ${{ inputs.cluster }}
      image-ref: ${{ needs.build.outputs.image-ref }}
    secrets: inherit
