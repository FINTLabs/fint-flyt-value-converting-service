fint:
  application-id: fint-flyt-value-converting-service

server:
  error:
    include-message: always

spring:
  application:
    name: ${fint.application-id}

  profiles:
    include:
      - flyt-kafka
      - flyt-web-resource-server
      - flyt-authorization-client
      - flyt-postgres
      - flyt-logging

  output:
    ansi:
      enabled: always
