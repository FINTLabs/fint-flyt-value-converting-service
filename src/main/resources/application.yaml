fint:
  application-id: fint-flyt-value-converting-service

server:
  error:
    include-message: always

spring:
  profiles:
    include:
      - flyt-kafka
      - flyt-web-resource-server
      - flyt-authorization-client
      - flyt-postgres
      - flyt-logging

  output:
    ansi:
      enabled: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
